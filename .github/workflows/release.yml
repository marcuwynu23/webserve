name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bin: webserve.exe
            archive: zip

          - os: linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: webserve
            archive: tar.gz

          - os: macos
            runner: macos-latest
            target: x86_64-apple-darwin
            bin: webserve
            archive: tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare release folder
        shell: bash
        run: mkdir -p release

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $src = "target/${{ matrix.target }}/release/${{ matrix.bin }}"
          $out = "release/webserve-${{ matrix.os }}-${{ matrix.target }}.zip"
          Compress-Archive -LiteralPath $src -DestinationPath $out -Force
          Write-Host "Created $out"

      - name: Package (Linux/macOS)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          OUT="release/webserve-${{ matrix.os }}-${{ matrix.target }}.${{ matrix.archive }}"

          if [[ "${{ matrix.archive }}" == "tar.gz" ]]; then
            tar -czf "$OUT" -C "$(dirname "$BIN_PATH")" "$(basename "$BIN_PATH")"
          fi

          echo "Created $OUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}